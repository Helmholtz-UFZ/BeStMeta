theme:
  name: material
  custom_dir: docs/overrides
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: deep-orange
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: deep-orange
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Roboto
    code: Roboto Mono
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/Helmholtz-UFZ/BeStMeta
  footer_logos:
  - name: UFZ
    image: assets/institutions/UFZ_logo.png
  - name: MDC
    image: assets/institutions/MDC_logo.png
  footer_logos_title: ''
  footer_logo_height: 3rem
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- toc
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
plugins:
- search
extra_css:
- assets/extra.css
