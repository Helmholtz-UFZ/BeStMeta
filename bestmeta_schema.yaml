        description: MPEG-4 Part 2 codec (DivX/Xvid); not to be confused with the mp4 container format.
      RAW:
        description: Uncompressed video; no codec applied.
      other:
        description: Other codec; describe in acquisition_notes.

  ContrastPolarityEnum:
    description: Polarity of object-to-background contrast in the video.
    permissible_values:
      bright_on_dark:
        description: >-
          Tracked object appears brighter than the background
          (analogous to dark-field imaging).
      dark_on_bright:
        description: >-
          Tracked object appears darker than the background
          (analogous to bright-field imaging).
      mixed:
        description: Polarity varies across regions, frames, or channels.
      unknown:
        description: Polarity not determined or not reported.