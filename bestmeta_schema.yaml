# =============================================================================
# BeStMeta Metadata Schema — Video Tracking Assay Metadata Standard
# Version: 0.1.0 (DRAFT)
# Based on: DOI:XX.XXXX/vta-paper (BeStMeta paper, 2026)
# License: CC-BY 4.0
# Author: Steffi Bredemeyer
# =============================================================================

id: https://w3id.org/bestmeta/schema
name: bestmeta
title: BeStMeta Metadata Schema
description: >-
  A cross-domain metadata schema for video tracking assays (VTAs) with focus on
  ecotoxicology and biomedical research. Designed to improve FAIR compliance
  by providing structured, machine-readable metadata for VTA datasets and
  individual trials.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/

# --- prefixes ---
prefixes:
  afr:        http://purl.allotrope.org/ontologies/result#
  AFQ:        http://purl.allotrope.org/ontologies/quality#
  BeStMeta:   https://w3id.org/BeStMeta/
  CHEBI:      http://purl.obolibrary.org/obo/CHEBI_
  CHMO:       http://purl.obolibrary.org/obo/CHMO_
  dcterms:    http://purl.org/dc/terms/
  dicom:      http://purl.org/healthcarevocab/v1#
  dwc:        http://rs.tdwg.org/dwc/terms/
  ebucore:    http://www.ebu.ch/metadata/ontologies/ebucore/ebucore#
  EDAM.DATA:  http://edamontology.org/data_
  EFO:        http://identifiers.org/efo/
  GENO:       http://purl.obolibrary.org/obo/GENO_
  linkml:     https://w3id.org/linkml/
  ma:         http://www.w3.org/ns/ma-ont#
  MESH:       http://identifiers.org/mesh/
  MIXS:       https://w3id.org/mixs/
  NCBITaxon:  http://purl.obolibrary.org/obo/NCBITaxon_
  NCIT:       http://purl.obolibrary.org/obo/NCIT_
  OBI:        http://purl.obolibrary.org/obo/OBI_
  OM:         http://www.ontology-of-units-of-measure.org/resource/om-2/
  OME:        http://www.openmicroscopy.org/Schemas/OME/2016-06#
  ORCID:      http://identifiers.org/orcid/
  pav:        http://purl.org/pav/
  PATO:       http://purl.obolibrary.org/obo/PATO_
  REPRODUCEME: https://w3id.org/reproduceme#
  schema:     http://schema.org/
  SNOMED:     http://snomed.info/id/
  STATO:      http://purl.obolibrary.org/obo/STATO_
  SWO:        http://purl.obolibrary.org/obo/SWO_
  UO:         http://purl.obolibrary.org/obo/UO_
  XCO:        http://purl.obolibrary.org/obo/XCO_
  xsd:        http://www.w3.org/2001/XMLSchema#

default_prefix: BeStMeta
default_range: string

# --- imports ---
imports:
  - linkml:types

# --- classes ---
classes:

  VTADataset:
    description: >-
      Top-level study and provenance metadata for a VTA dataset.
      One record per publication or deposited dataset. Contains
      identifying, licensing, and bibliographic information.
    slots:
      # required
      - dataset_id
      - dataset_title
      - dataset_license
      # recommended
      - dataset_description
      - dataset_doi
      - publication_doi
      - dataset_creator_name
      - dataset_creator_orcid
      - dataset_contact_email
      - research_domain
      - raw_data_repository
      - raw_data_repository_url
      - raw_tracking_data_format
      # optional
      - dataset_version
      - dataset_created_date
      - raw_tracking_data_doi
      - analysis_code_repository
      - analysis_code_repository_url
      - analysis_code_doi
      - dataset_notes
      # --- Nested classes ---
      - experimental_conditions
      - hardware_and_acquisition
      - tracking_analysis
      - statistical_analysis
    tree_root: true

################################
### Experimental Conditions ####
################################

  ExperimentalConditions:
    description: >-
      Biological and experimental conditions applicable to all trials in
      the dataset. Covers organism identity, treatment, assay design,
      and environmental parameters.
    abstract: true
    slots:
      - subject
      - experiment
      #optional
      - manipulation
      - experiment_notes

  Subject:
    description: >-
        Biological identity of the organism(s) that is studied.
        Contains details like taxonomy, strain, genotype, sex, age
        and/or other morphometric details and measurements.
    slots:
      # discriminator -- required
      - subject_type
      # required
      - species_name
      # recommended
      - species_ncbi_taxon_id
      - strain
      - genotype
      - sex
      - body_length_value
      - body_length_unit
      - housing_conditions
      # conditionally required
      - developmental_stage
      - developmental_stage_value
      - developmental_stage_unit
      - age_value
      - age_unit
      # optional
      - weight_value
      - weight_unit


    # At least one of: developmental_stage, developmental_stage_value+unit, 
    # or age_value+unit must be provided  
    any_of:
      - slot_conditions:
          developmental_stage:
            required: true
      - slot_conditions:
          developmental_stage_value:
            required: true
          developmental_stage_unit:
            required: true
      - slot_conditions:
          age_value:
            required: true
          age_unit:
            required: true

    rules:
    
      - description: >-
          When subject_type is organism, sex is a recommended field. 
        preconditions:
          slot_conditions:
            subject_type:
              equals_string: organism
        postconditions:
          slot_conditions:
            sex:
              recommended: true

        
      - description: body_length_value requires body_length_unit
        preconditions:
          slot_conditions:
            body_length_value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            body_length_unit:
              required: true

      - description: weight_value requires weight_unit
        preconditions:
          slot_conditions:
            weight_value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            weight_unit:
              required: true

  Experiment:
    description: >-
        Defines experimental context in which the subjects were studied.
        Covers environmental parameters like study counts, arena geometry,
        temperature, multi well plate details etc.
    slots:
      # required      
      - n_individuals_total
      - n_individuals_per_arena
      - assay_type
      # recommended
      - experiment_start_datetime
      - experiment_end_datetime
      - assay_description
      - arena_shape
      - arena_type
      - arena_length
      - arena_length_unit
      - arena_width
      - arena_width_unit
      - arena_height
      - arena_height_unit
      - plate_well_count
      - well_shape_cross_section
      - temperature_celsius
      - light_cycle_type
      - light_cycle_detail
      # optional   
      - assay_description

    rules:
      - description: arena_length requires arena_length_unit
        preconditions:
          slot_conditions:
            arena_length:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            arena_length_unit:
              required: true

      - description: arena_width requires arena_width_unit
        preconditions:
          slot_conditions:
            arena_width:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            arena_width_unit:
              required: true

      - description: arena_height requires arena_height_unit
        preconditions:
          slot_conditions:
            arena_height:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            arena_height_unit:
              required: true

      - description: If light_cycle_type is cyclic_ld, light_cycle_detail should be provided.
        preconditions:
          slot_conditions:
            light_cycle_type:
              equals_string: cyclic_ld
        postconditions:
          slot_conditions:
            light_cycle_detail:
              required: true


  Manipulation:
    description: >-
         Treatment and chemical exposure information decribing pharmacological,
         toxicological and/or any other interventions that subjects went through.
         This sub-class can be omitted where no interventions were used.
    slots:
        # recommended        
        - treatment_name
        - treatment_description
        - exposure_compound_name
        - exposure_compound_chebi_id
        - exposure_concentration
        - exposure_concentration_unit
        # optional            
        - well_shape_bottom
        - habituation_duration_min
        - habituation_protocol
        - housing_conditions
        - exposure_route
        - exposure_duration_h
        - solvent_vehicle
        - control_type


    rules:
      - description: >-
          exposure_concentration requires exposure_concentration_unit.
        preconditions:
          slot_conditions:
            exposure_concentration:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            exposure_concentration_unit:
              required: true

      - description: >-
          exposure_compound_name is recommended when
          exposure_compound_chebi_id is provided.
        preconditions:
          slot_conditions:
            exposure_compound_chebi_id:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            exposure_compound_name:
              recommended: true
              
  DeviceTypeMixin:
    description: >-
      Reusable slot bundle providing device_type, allowing multiple
      classes (e.g. Hardware, TrackingAnalysis) to independently branch
      their validation rules based on the type of imaging system used,
      without requiring cross-class rule evaluation.
    mixin: true
    slots:
      - device_type

################################
### Hardware and Acquisition ###
################################

  HardwareandAcquisition:
    description: >-
      Defines video hardware configuration (camera or microscope) and
      acquisiiton or recording parameters used during experiments.
    #tree_root: true
    slots:
      # required
      - hardware
      - acquisition
      # optional
      - hardware_acquisition_notes

  Hardware:
    description: >-
      Camera systems, optical configuration, and physical recording
      infrastructure used in the VTA. Documents instrument identity and
      optical specifications.
    mixins:
      # discriminatior - required
      - DeviceTypeMixin
    slots:
      # required if device_type == camera
      - camera_count
      - camera_type
      - camera_model
      - camera_manufacturer
      # required if device_type == microscope
      #- microscope_views ###number of views
      - microscope_manufacturer
      - microscope_model
      - microscope_type
      # required if device_type == closed_box_system
      - closed_box_system_name
      # required if device_type == in_house_system
      - in_house_system_description
      # scale-defining fields (requiredness governed by rules below)
      - field_of_view_width
      - field_of_view_height
      - field_of_view_unit
      - objective_magnification
      # recommended, contextual across device types
      - camera_position
      - camera_distance_mm
      - lens_focal_length_mm
      - camera_sensor_type
      - contrast_polarity
      - closed_box_system_version
      - well_plate_format
      - subjects_per_field_of_view
      - in_house_system_components
      - in_house_system_designer
      # optional
      - camera_interface
      - microscope_serial_number
      - microscope_lot_number
      - hardware_notes
    
    rules:

      # ---------- CAMERA ----------
      - description: >-
          When device_type is camera, camera identity fields and field of
          view are required, since the user directly controls and can
          measure the optical setup.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: camera
        postconditions:
          slot_conditions:
            camera_count:
              value_presence: PRESENT
            camera_type:
              value_presence: PRESENT
            camera_model:
              value_presence: PRESENT
            camera_manufacturer:
              value_presence: PRESENT
            field_of_view_width:
              value_presence: PRESENT
            field_of_view_height:
              value_presence: PRESENT
            field_of_view_unit:
              value_presence: PRESENT

      - description: >-
          When device_type is camera, additional descriptive fields are
          recommended but not required.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: camera
        postconditions:
          slot_conditions:
            camera_position:
              recommended: true
            camera_distance_mm:
              recommended: true
            lens_focal_length_mm:
              recommended: true
            camera_sensor_type:
              recommended: true

      # ---------- MICROSCOPE ----------
      - description: >-
          When device_type is microscope, microscope identity fields are
          required.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: microscope
        postconditions:
          slot_conditions:
            microscope_manufacturer:
              value_presence: PRESENT
            microscope_model:
              value_presence: PRESENT
            microscope_type:
              value_presence: PRESENT

      - description: >-
          If field of view is reported for a microscope, width, height,
          and unit must all be present together.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: microscope
          any_of:
            - slot_conditions:
                field_of_view_width:
                  value_presence: PRESENT
            - slot_conditions:
                field_of_view_height:
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            field_of_view_width:
              value_presence: PRESENT
            field_of_view_height:
              value_presence: PRESENT
            field_of_view_unit:
              value_presence: PRESENT

      - description: >-
          When device_type is microscope, field of view, objective
          magnification, and contrast polarity are recommended but not
          required.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: microscope
        postconditions:
          slot_conditions:
            field_of_view_width:
              recommended: true
            field_of_view_height:
              recommended: true
            field_of_view_unit:
              recommended: true
            objective_magnification:
              recommended: true
            contrast_polarity:
              recommended: true

      # ---------- CLOSED-BOX SYSTEM ----------
      - description: >-
          When device_type is closed_box_system, the system name is
          required. Field of view is not required, since proprietary
          multi-well/plate-based systems (e.g. ecotox zebrafish platforms)
          often have a fixed, manufacturer-defined optical path that the
          end user cannot measure or does not control.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: closed_box_system
        postconditions:
          slot_conditions:
            closed_box_system_name:
              value_presence: PRESENT

      - description: >-
          If field of view is reported for a closed-box system, width,
          height, and unit must all be present together.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: closed_box_system
          any_of:
            - slot_conditions:
                field_of_view_width:
                  value_presence: PRESENT
            - slot_conditions:
                field_of_view_height:
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            field_of_view_width:
              value_presence: PRESENT
            field_of_view_height:
              value_presence: PRESENT
            field_of_view_unit:
              value_presence: PRESENT

      - description: >-
          When device_type is closed_box_system, the system version,
          field of view, and well/plate-related fields are recommended
          but not required.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: closed_box_system
        postconditions:
          slot_conditions:
            closed_box_system_version:
              recommended: true
            field_of_view_width:
              recommended: true
            field_of_view_height:
              recommended: true
            field_of_view_unit:
              recommended: true
            well_plate_format:
              recommended: true
            subjects_per_field_of_view:
              recommended: true

      # ---------- IN-HOUSE SYSTEM ----------
      - description: >-
          When device_type is in_house_system, a description of the
          custom setup and field of view are required, since the builder
          directly controls and should know the optical configuration.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: in_house_system
        postconditions:
          slot_conditions:
            in_house_system_description:
              value_presence: PRESENT
            field_of_view_width:
              value_presence: PRESENT
            field_of_view_height:
              value_presence: PRESENT
            field_of_view_unit:
              value_presence: PRESENT

      - description: >-
          When device_type is in_house_system, listing components and
          the designer is recommended for reproducibility.
        preconditions:
          slot_conditions:
            device_type:
              equals_string: in_house_system
        postconditions:
          slot_conditions:
            in_house_system_components:
              recommended: true
            in_house_system_designer:
              recommended: true

  Acquisition:
    description: >-
      Video acquisition and recording parameters, including timing
      encoding and illumination details.
    slots:
      # required
      - recording_duration
      - recording_software_name
      - recording_software_version
      - frame_rate
      - video_resolution_width
      - video_resolution_height
      - video_container_format
      # recommended      
      - recording_start_datetime
      - recording_end_datetime
      - illumination_type
      - spatial_resolution
      - video_codec
      - exposure_time
      - noise_reduction_method
      # conditionally required  
      - bit_depth
      # opional
      - illumination_wavelength
      - illumination_illuminance
      - total_frame_count
      - color_mode
      - gain
      - acquisition_notes

    rules:
      - description: Bit depth should be reported when it is available for lossless or uncompressed video.
        preconditions:
          slot_conditions:
            video_codec:
              any_of:
                - equals_string: ffv1
                - equals_string: raw
        postconditions:
          slot_conditions:
            bit_depth:
              recommended: true
              
##########################
### Tracking Analysis ###
#########################

  TrackingAnalysis:
    description: >-
      Tracking software identity and version, algorithm details,
      post-tracking computational steps and derived behavioral metrics.
    mixins:
      - DeviceTypeMixin
    slots:
      # required
      - tracking_software_name
      # conditionally required
      - tracking_algorithm
      # recommended
      - tracking_software_type
      - tracking_software_version
      - tracking_software_settings
      - tracking_data_format
      - tracking_confidence_threshold
      - tracking_manual_correction
      - compute_hardware
      - preprocessing_steps
      - n_individuals_tracked_per_arena
      - n_bodyparts_tracked
      - dropped_frames_count
      - frames_without_tracked_individual
      - frames_without_tracked_bodypart
      - behavioral_metrics
      - endpoint_definitions
      # optional
      - dropped_frames_reason
      - tracking_notes
      
    rules:

      - description: >-
          [ALGORITHM - required for camera/microscope] Tracking algorithm
          is required for camera and microscope systems, where the
          algorithm used is knowable and documentable.
        preconditions:
          slot_conditions:
            device_type:
              any_of:
                - equals_string: camera
                - equals_string: microscope
        postconditions:
          slot_conditions:
            tracking_algorithm:
              value_presence: PRESENT

      - description: >-
          [ALGORITHM - recommended for closed-box/in-house] When
          device_type is closed_box_system or in_house_system, tracking
          algorithm is recommended but not required. Closed-box systems
          often don't disclose their underlying algorithm; in-house
          systems may use informal or evolving methods not yet formally
          documented.
        preconditions:
          slot_conditions:
            device_type:
              any_of:
                - equals_string: closed_box_system
                - equals_string: in_house_system
        postconditions:
          slot_conditions:
            tracking_algorithm:
              recommended: true
      
############################
### Statistical Analysis ###
############################

  StatisticalAnalysis:
    description: >-
      Information describing the statistical analysis of behavioral data,
      including statistical tests, models, significance criteria,
      multiple-testing corrections, and other methods used to evaluate
      experimental outcomes.
    slots:
      # recommended
      - statistical_software_name
      - statistical_software_version
      - statistical_tests
      - statistical_models
      - multiple_testing_correction
      - significance_level
      - effect_size_measure
      - confidence_interval_level
      - sample_size_analysis
      # optional
      - statistics_notes
      
#####################################################################################
### SLOTS ###
#####################################################################################
# --- slots ---
slots:

##########################
# --- VTADataset slots ---
##########################

  dataset_id:
    description: Unique identifier for the dataset or study package.
    identifier: true
    required: true
    exact_mappings:
      - dcterms:identifier

  dataset_title:
    description: Descriptive title of the dataset.
    required: true
    exact_mappings:
      - dcterms:title

  dataset_license:
    description: SPDX license identifier or URL (e.g. CC-BY-4.0)
    required: true
    exact_mappings:
      - dcterms:license

  dataset_description:
    description: Free-text description of the dataset and its scientific purpose
    required: false
    recommended: true
    exact_mappings:
      - dcterms:description

  dataset_doi:
    description: DOI of the deposited dataset (assigned by repository)
    range: uri
    required: false
    recommended: true
    multivalued: false
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"
    exact_mappings:
      - schema:identifier
    close_mappings:
    - dcterms:identifier

  publication_doi:
    description: DOI of the publication associated with the dataset.
    range: uri
    required: false
    recommended: true
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"
    exact_mappings:
      - schema:citation
      - dcterms:references

  dataset_creator_name:
    description: Name(s) of data creators.
    required: false
    recommended: true
    multivalued: true
    exact_mappings:
      - dcterms:creator
      - schema:creator

  dataset_creator_orcid:
    description: ORCID identifier of the dataset creator.
    required: false
    recommended: true
    multivalued: true
    range: uri
    pattern: '^https://orcid\.org/\d{4}-\d{4}-\d{4}-\d{3}[0-9X]$'
    exact_mappings:
    - schema:identifier
    - dcterms:identifier

  dataset_contact_email:
    range: string
    required: false
    recommended: true
    description: Contact email for the dataset maintainer.
    pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
    exact_mappings:
      - schema:email

  research_domain:
    description: Primary research domain of this study.
    range: string
    required: false
    recommended: true
    exact_mappings:
      - dcterms:subject

  raw_data_repository:
    description: Repository where raw tracking data and/or video files are deposited.
    required: false
    recommended: true
    range: string

  raw_data_repository_url:
    description: URL of the repository record or landing page.
    required: false
    recommended: true
    range: uri
    exact_mappings:
      - schema:url
      - dcterms:source

  raw_tracking_data_format:
    description: File format of the raw tracking data.
    required: false
    recommended: true
    range: string
    multivalued: true

  dataset_version:
    description: Semantic version string for the dataset (e.g. 1.0.0)
    required: false
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    exact_mappings:
      - pav:version
      - schema:version

  dataset_created_date:
    description: Date when the dataset was created (YYYY-MM-DD)
    range: date
    required: false
    exact_mappings:
      - dcterms:created

  raw_tracking_data_doi:
    description: DOI of the deposited raw tracking data
    required: false
    range: uri
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"
    exact_mappings:
    - schema:identifier
    close_mappings:
    - dcterms:identifier

  analysis_code_repository:
    description: Repository where analysis code is hosted.
    required: false
    range: string

  analysis_code_repository_url:
    description: URL of the code repository.
    required: false
    range: uri
    exact_mappings:
      - schema:codeRepository
      - schema:url

  analysis_code_doi:
    description: DOI of the deposited analysis code.
    required: false
    range: uri
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"

  dataset_notes:
    description: Free-text notes on the dataset not captured by structured fields.
    required: false
    range: string

  # Nested class slots
  experimental_conditions:
    description: Biological and experimental conditions for this dataset
    range: ExperimentalConditions
    inlined: true

  hardware_and_acquisition:
    description: >-
      Hardware and acquisition configuration used to record the video
      dataset.
    range: HardwareandAcquisition
    inlined: true
    

  tracking_analysis:
    description: Tracking software and analysis configuration
    range: TrackingAnalysis
    inlined: true

  statistical_analysis:
    description: Statistical analysis for this dataset
    range: StatisticalAnalysis
    inlined: true

######################################
# --- ExperimentalConditions slots ---
######################################

  subject_type:
    range: SubjectTypeEnum
    required: true
    description: >-
      Indicates whether the subject being tracked is a whole organism or
      a cell/cell culture; determines which biological identity fields
      are applicable.

  species_name:
    description: Scientific (Latin) binomial name of the study organism
    required: true
    range: string
    exact_mappings:
      - dwc:scientificName
      - EDAM.DATA:1045
    examples:
      - value: "Danio rerio"
      - value: "Mus musculus"
      - value: "Daphnia magna"

  n_individuals_total:
    description: Total number of individuals used in the experiment.
    range: integer
    required: true

  n_individuals_per_arena:
    description: Number of individuals tested simultaneously in the arena.
    required: true
    range: integer
    minimum_value: 1

  assay_type:
    description: Name of the behavioral assay paradigm or test paradigm.
    required: true
    examples:
      - value: "open field test"
      - value: "light-dark transition"
      - value: "elevated plus maze"
      - value: "locomotor activity assay"
      - value: "chemobehavioral assay"
    broad_mappings:
      - OBI:0000070

  experiment_start_datetime:
    description: Date and time at which the experiment began.
    range: datetime
    required: false
    recommended: true

  experiment_end_datetime:
    description: Date and time at which the experiment ended.
    range: datetime
    required: false
    recommended: true

  species_ncbi_taxon_id:
    description: NCBI Taxonomy ID for the study organism
    required: false
    recommended: true
    range: string
    pattern: "^\\d+$"
    exact_mappings:
      - dwc:taxonID
      - EDAM.DATA:1179
    examples:
      - value: "7955" #Danio rerio
      - value: "10090" #Mus musculus

  strain:
    description: Organism strain or line
    required: false
    recommended: true
    range: string
    exact_mappings:
      - EDAM.DATA:2379

  genotype:
    description: >-
      Genotype identifier of the tracked organism(s) including
      strain-specific, mutant, transgenic, or engineered genotypes.
    range: string
    required: false
    recommended: true
    exact_mappings:
      - EFO:0000513
      - GENO:0000536
    annotations:
      source_ontology: GENO

  sex:
    description: Biological sex of the tracked organism(s).
    required: false
    recommended: true
    range: SexEnum
    exact_mappings:
      - PATO:0000047

  body_length_value:
    description: Body length numeric value of the tracked organism(s).
    required: false
    recommended: true
    range: float
    close_mappings:
      - EFO:0004339
      - MESH:D049628

  body_length_unit:
    description: Body length unit of the tracked organism(s).
    required: false
    recommended: true
    range: LengthUnitEnum

  arena_shape:
    description: Geometric shape of the test arena.
    required: false
    recommended: true
    range: ArenaShapeEnum
    broad_mappings:
      - OBI:0000968

  arena_type:
    description: Type of the test arena, e.g., open field, multiwell plate or elevated plus maze.
    required: false
    recommended: true
    range: ArenaTypeEnum

  arena_length:
    description: Length of the arena along one axis.
    required: false
    recommended: true
    range: float

  arena_length_unit:
    description: Unit of measurement for arena_length.
    required: false
    recommended: true
    range: LengthUnitEnum

  arena_width:
    description: Width of the arena along one axis.
    required: false
    recommended: true
    range: float

  arena_width_unit:
    description: Unit of measurement for arena_width.
    required: false
    recommended: true
    range: LengthUnitEnum

  arena_height:
    description: Height of the arena, when applicable.
    required: false
    recommended: true
    range: float

  arena_height_unit:
    description: Unit of measurement for arena_height.
    required: false
    recommended: true
    range: LengthUnitEnum

  plate_well_count:
    description: Number of wells in the multiwell plate.
    required: false
    recommended: true
    range: integer
    minimum_value: 1
    exact_mappings:
      - AFR:0002231
    examples:
      - value: "24"
      - value: "96"

  well_shape_cross_section:
    description: Geometric cross section shape of the wells of a multiwell plate.
    required: false
    recommended: true
    range: WellCrossSectionShapeEnum

  temperature_celsius:
    description: Water or ambient temperature during the recording in degrees Celsius
    range: float
    required: false
    recommended: true
    unit:
      ucum_code:  Cel

  light_cycle_type:
    description: Standardized category of the light-dark cycle.
    required: false
    recommended: true
    range: LightCycleTypeEnum

  light_cycle_detail:
    description: Free-text description of the light-dark cycle.
    required: false
    recommended: true
    range: string
    exact_mappings:
      - MESH:D017440

  treatment_name:
    description: Short label identifying the experimental treatment group, condition, or regimen.
    required: false
    recommended: true
    range: string
    exact_mappings:
      - NCIT:C82542
    examples:
      - value: "diazepam 1 mg/kg"
      - value: "atrazine 10 ug/L"
      - value: "vehicle control"

  treatment_description:
    description: Full description of the treatment protocol.
    required: false
    recommended: true
    range: string

  exposure_compound_name:
    description: Name of the chemical, drug, or substance used in the treatment or exposure.
    required: false
    recommended: true
    range: string
    exact_mappings:
      - EDAM.DATA:0997

  exposure_compound_chebi_id:
    description: ChEBI identifier for the test substance.
    required: false
    recommended: true
    range: string
    pattern: "^CHEBI:\\d+$"
    exact_mappings:
      - EDAM.DATA:1174
    examples:
      - value: "CHEBI:15930"   # atrazine
      - value: "CHEBI:49575"  # diazepam

  exposure_concentration:
    description: Nominal exposure concentration (numeric value only; use unit field).
    required: false
    recommended: true
    range: float
    exact_mappings:
      - EDAM.DATA:2140

  exposure_concentration_unit:
    description: Unit for exposure concentration.
    required: false
    recommended: true
    range: ConcentrationUnitEnum

  developmental_stage:
    description: Developmental stage of the tracked organism(s).
    range: DevelopmentalStageEnum
    exact_mappings:
      - EFO:0000399

  developmental_stage_value:
    description: Numeric developmental stage value (e.g. 72 for 72 hpf) of the tracked organism(s).
    range: float
    close_mappings:
      - EFO:0000399

  developmental_stage_unit:
    description: Unit for developmental stage value of the tracked organism(s).
    range: DevelopmentUnitEnum

  age_value:
    description: Numeric age value of the tracked organism(s).
    range: float
    exact_mappings:
      - EFO:0000246

  age_unit:
    description: Age unit of the tracked organism(s).
    range: DevelopmentUnitEnum

  weight_value:
    description: Body weight numeric value of the tracked organism(s).
    required: false
    range: float
    exact_mappings:
      - EFO:0004338

  weight_unit:
    description: Body weight unit of the tracked organism(s).
    required: false
    range: WeightUnitEnum

  assay_description:
    description: Free-text description of the assay protocol
    required: false

  well_shape_bottom:
    description: Geometric bottom shape of the wells of a multiwell plate.
    required: false
    range: WellBottomShapeEnum

  habituation_duration_min:
    description: Duration of habituation period before recording, in minutes
    required: false
    range: float
    unit:
      ucum_code: min

  habituation_protocol:
    description: Description of habituation or acclimation prior to testing.
    required: false
    range: string

  housing_conditions:
    description: Free-text description of animal housing conditions prior to assay.
    required: false
    range: string
    exact_mappings:
      - XCO:0000033

  exposure_route:
    description: Route of chemical or treatment administration.
    required: false
    range: ExposureRouteEnum
    exact_mappings:
      - MESH:D004333

  exposure_duration_h:
    description: Duration of chemical or treatment exposure in hours.
    required: false
    range: float
    unit:
      ucum_code: h

  solvent_vehicle:
    description: Solvent or vehicle used to dissolve the test substance.
    required: false
    range: string
    examples:
      - value: "DMSO 0.01%"
      - value: "ethanol 0.1%"
      - value: "water"

  control_type:
    description: Type of control group used.
    required: false
    range: ControlTypeEnum
    exact_mappings:
      - NCIT:C178849 
  
  subject:
    description: The organism(s) studied under these experimental conditions.
    range: Subject
    required: true
  

  experiment:
    description: The experimental setup and environment for this dataset's trials.
    range: Experiment
    required: true

  manipulation:
    description: >-
      Any intervention applied to the subjects. Omitted when no
      treatment or exposure was used.
    range: Manipulation
    required: false

  experiment_notes:
    description: Free-text notes on the overall experimental conditions.
    required: false
    range: string


###################################################################################
# --- Hardware and Acquisition slots --
###################################################################################
  hardware:
    range: Hardware
    required: true
    inlined: true
    description: Hardware configuration used to record the video.

  acquisition:
    range: Acquisition
    required: true
    inlined: true
    description: Acquisition/recording parameters for the video.

  hardware_acquisition_notes:
    range: string
    description: >-
      Free-text catch-all for additional context about the hardware and
      acquisition setup as a whole that does not fit within hardware_notes
      or acquisition_notes specifically (e.g. deviations from standard
      protocol, or setup issues spanning both hardware and acquisition).
      
# --- hardware slots --- #
    
  device_type:
    range: DeviceTypeEnum
    required: true
    description: >-
      Indicates the category of imaging system used; determines which
      additional hardware or tracking fields are required or recommended.

  camera_count:
    description: Number of cameras used simultaneously.
    required: true
    range: integer

  camera_type:
    description: General type of imaging device.
    required: true
    range: CameraTypeEnum
    broad_mappings:
      - OBI:0000398

  camera_model:
    description: Full manufacturer model name of the camera.
    required: true
    range: string
    examples:
      - value: "Basler acA1300-60gc"
      - value: "Logitech C920"

  camera_manufacturer:
    description: Manufacturer of the camera.
    required: true
    range: string
    exact_mappings:
      - schema:manufacturer

  camera_sensor_type:
    description: Image sensor technology.
    required: false
    recommended: true
    range: CameraSensorTypeEnum

  camera_distance_mm:
    description: Distance from camera lens to the arena floor in millimetres.
    required: false
    recommended: true
    range: float
    unit:
      ucum_code: mm

  camera_position:
    description: Position of the camera relative to the arena.
    required: false
    recommended: true
    range: CameraPositionEnum

  lens_focal_length_mm:
    description: >-
      Focal length of the imaging lens in millimetres;
      applicable to camera or microscope optics when reported.
    required: false
    recommended: true
    range: float
    unit:
      ucum_code: mm
    exact_mappings:
      - AFQ:0000062

  objective_magnification:
    description: Magnification of microscope objective (if applicable).
    required: false
    recommended: true
    range: float
    annotations:
      ome_element: Objective/Magnification
    examples:
      - value: "4"
      - value: "10"

  contrast_polarity:
    description: >-
      Contrast relationship between the tracked object and the background;
      indicates whether the subject appears bright on a dark background or
      dark on a bright background in the recorded video.
    required: false
    recommended: true
    range: ContrastPolarityEnum

  field_of_view_width:
    description: Numeric value of horizontal field of view covered by the camera.
    required: false
    recommended: true
    range: float

  field_of_view_height:
    description: Numeric value of vertical field of view covered by the camera.
    required: false
    recommended: true
    range: float

  field_of_view_unit:
    description: Unit of measurement for field_of_view_width and field_of_view_height.
    range: LengthUnitEnum

  camera_interface:
    description: Interface standard used for communication between the camera and the acquisition system.
    required: false
    range: CameraInterfaceEnum

  microscope_manufacturer:
    description: Manufacturer of the microscope.
    required: false
    range: string
    exact_mappings:
      - OME:Manufacturer
      - schema:manufacturer

  microscope_model:
    description: Model name or identifier of the microscope.
    required: false
    range: string
    exact_mappings:
      - OME:Model

  microscope_type:
    description: Microscope configuration according to the OME microscope type classification.
    required: false
    range: MicroscopeTypeEnum
    exact_mappings:
      - OME:Type

  microscope_serial_number:
    description: Serial number of the microscope.
    required: false
    range: string
    exact_mappings:
      - OME:SerialNumber

  microscope_lot_number:
    description: Lot number of the microscope.
    required: false
    range: string
    exact_mappings:
      - OME:LotNumber
      
  well_plate_format:
    range: WellPlateFormatEnum
    description: >-
      Format of the multi-well plate used in a closed-box imaging system
      (e.g. "96-well", "24-well"), when applicable.
      
  subjects_per_field_of_view:
    range: integer
    description: >-
      Number of individual subjects (e.g. wells, organisms, larvae)
      visible within a single field of view or camera frame, when
      applicable.

  closed_box_system_name:
    description: >-
      Name of the integrated commercial closed-box tracking system.
      (e.g. ZebraBox, DanioVision, ToxMate, PhenoTyper).
    required: false
    range: ClosedBoxSystemEnum

  closed_box_system_version:
    description: Hardware version or model number of the closed-box system.
    required: false
    range: string
    
  in_house_system_description:
    range: string
    description: >-
      Free-text description of the custom-built imaging system, including
      how the components are assembled and used.

  in_house_system_components:
    range: string
    multivalued: true
    description: >-
      List of key hardware components used in the custom-built system
      (e.g. camera sensor, lens, illumination source, mounting hardware).

  in_house_system_designer:
    range: string
    description: >-
      Lab, person, or institution that designed or built the in-house
      system.

  hardware_notes:
    description: Free-text notes on hardware configuration not captured by structured fields.
    required: false
    range: string

# --- acquisition slots ---
  recording_duration:
    description: Total duration of the video recording in ISO 8601 duration format.
    required: true
    range: duration
    exact_mappings:
      - AFR:0000951
    close_mappings:
      - schema:duration
    examples:
      - value: "PT30M"
        description: 30 minutes
      - value: "PT1H15M30S"
        description: 1 hour, 15 minutes, 30 seconds
      - value: "PT45S"
        description: 45 seconds
    notes:
      - Use ISO 8601 duration format.

  recording_software_name:
    description: Name of the software used to record the video.
    required: true
    range: string
    exact_mappings:
      - AFR:0002802

  recording_software_version:
    description: Version string of the recording software.
    required: true
    range: string
    exact_mappings:
      - AFR:0001700

  frame_rate:
    description: Number of frames captured per second (fps) during video recording.
    required: true
    range: float
    unit:
      ucum_code: Hz
    exact_mappings:
      - ebucore:frameRate
    close_mappings:
      - ma:frameRate

  video_resolution_width:
    description: Horizontal pixel count of the recorded video.
    required: true
    range: integer
    unit:
      ucum_code: px
    close_mappings:
      - ebucore:width

  video_resolution_height:
    description: Vertical pixel count of the recorded video.
    required: true
    range: integer
    unit:
      ucum_code: px
    close_mappings:
      - ebucore:height

  video_container_format:
    description: File container format of the recorded video.
    required: true
    range: VideoContainerEnum
    exact_mappings:
      - ebucore:hasContainerFormat
    notes:
      - Report the container format, not the codec.
      - Codec is captured separately in video_codec.

  recording_start_datetime:
    description: Date and time at which acquisition of the video recording began.
    range: datetime
    required: false
    recommended: true

  recording_end_datetime:
    description: Date and time at which acquisition of the video recording ended.
    range: datetime
    required: false
    recommended: true

  illumination_type:
    description: Type of illumination used during recording.
    required: false
    recommended: true
    range: IlluminationTypeEnum
    exact_mappings:
      - MIxS:0000769

  spatial_resolution:
    description: Physical size represented by one pixel at the observation plane.
    required: false
    recommended: true
    range: float
    unit:
      ucum_code: mm/px
    close_mappings:
      - dicom:SpatialResolution

  video_codec:
    description: Video compression codec used for recording.
    required: false
    recommended: true
    range: VideoCodecEnum
    exact_mappings:
      - ebucore:codecName
    notes:
      - Report the codec, not the container format.
      - Container format is captured separately in video_container_format.
      - mp4 is a container, not a codec — most mp4 files use H264 or H265 as codec.

  exposure_time:
    description: Camera sensor exposure time per frame.
    required: false
    recommended: true
    range: float
    unit:
      ucum_code: ms
    exact_mappings:
      - REPRODUCEME:ExposureTime

  noise_reduction_method:
    description: Method or algorithm used to reduce image noise during acquisition or immediately after recording.
    range: string
    required: false
    recommended: true

  bit_depth:
    description: Bit depth per pixel channel of the recorded video.
    required: false
    range: integer
    exact_mappings:
    - ebucore:bitDepth
    examples:
      - value: "8"
      - value: "16"
    notes:
      - Common values are 8-bit and 16-bit.

  illumination_wavelength:
    description: >-
      Peak wavelength of the illumination source in nanometres.
      Use for non-white-light sources such as infrared or UV.
    required: false
    range: float
    unit:
      ucum_code: nm
    exact_mappings:
      - AFR:0001159
    close_mappings:
      - PATO:0001242

  illumination_illuminance:
    description: Illuminance at the recording arena or observation surface.
    required: false
    range: float
    unit:
      ucum_code: lx
    exact_mappings:
      - OM:Illuminance
    examples:
      - value: "0"
        description: Dark condition
      - value: "100"
        description: Dim illumination
      - value: "1000"
        description: Bright laboratory illumination

  total_frame_count:
    description: >-
      Total number of frames in the video. Can be derived from
      frame_rate × recording_duration if not explicitly stated.
    range: integer
    required: false
    exact_mappings:
      - dicom:NumberOfFrames
    notes:
      - Prefer direct reporting when available.
      - If absent, it may be computed from frame rate and actual trial duration.

  color_mode:
    description: >-
      Color mode of the recorded video.
      Affects tracking algorithm behavior and file size.
    required: false
    range: ColorModeEnum

  gain:
    description: Camera gain setting at the time of recording.
    required: false
    range: string
    exact_mappings:
      - AFQ:0000201

  acquisition_notes:
    description: Free-text notes on acquisition settings
    required: false
    range: string

# --- TrackingAnalysis slots ---
  tracking_software_type:
      description: Indicates whether the tracking analysis was performed using a custom software or a standard package or software
      required: false
      recommended: true
      range: TrackingSoftwareTypeEnum

  tracking_software_name:
      description: Name of the software used for tracking.
      required: true
      range: string
      exact_mappings:
        - AFR:0002802

  tracking_software_version:
    description: Version string of the tracking software.
    required: false
    recommended: true
    range: string
    exact_mappings:
      - AFR:0001700

  tracking_algorithm:
    description: >-
      Algorithmic approach used to detect, identify, and track organisms in
      video recordings. Multiple values may be provided when tracking is
      performed using a pipeline of methods.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "background subtraction"
      - value: "centroid tracking"
      - value: "YOLO object detection"
      ##  add augmentation here

  tracking_software_settings:
    description: >-
      Key tracking configuration parameters used during analysis,
      including software-specific settings required to reproduce
      tracking results.
    required: false
    recommended: true
    range: string
    examples:
      - value: "Detection threshold=25; minimum blob size=50 px"
      - value: "DeepLabCut likelihood threshold=0.9"
      - value: "Interpolation enabled; gap length=5 frames"

  tracking_data_format:
    description: >-
      File format used to store tracking results, including coordinates,
      keypoints, identities, trajectories, annotations, or derived outputs.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "CSV"
      - value: "HDF5"
      - value: "JSON"
      - value: "NWB"
      - value: "DeepLabCut .h5"
      - value: "SLEAP .slp"
      - value: "ZebraBox PHR"
    notes:
      - Report the output format of the tracking results, not the raw video container.
      - Use this for coordinate/keypoint files and derived tracking outputs.

  tracking_confidence_threshold:
    description: >-
      Confidence or likelihood threshold used to accept detections,
      identities, tracks, or keypoints during tracking analysis.
    required: false
    recommended: true
    range: float
    examples:
      - value: "0.9"
      - value: "0.3"

  tracking_manual_correction:
    description: >-
      Whether tracking results were manually reviewed, corrected, or curated
      after automated tracking.
    required: false
    recommended: true
    range: boolean
    examples:
      - value: "true"
      - value: "false"
    notes:
      - Use true if outputs were manually curated, corrected, or quality-checked by a human after automated tracking.

  compute_hardware:
    description: >-
      Primary compute hardware used for tracking and analysis.
      Include model information when available.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "GPU (NVIDIA RTX 3090)"
      - value: "GPU (NVIDIA A100 80GB)"
      - value: "CPU (Intel Xeon Gold 6248)"
      - value: "CPU (AMD Ryzen 9 7950X)"

  preprocessing_steps:
    description: >-
      Preprocessing steps applied to video before tracking to enhance quality
      or isolate features.
    required: false
    recommended: true
    range: PreprocessingStepEnum
    multivalued: true

  n_individuals_tracked_per_arena:
    description: Number of individuals actually tracked in a single arena or trial.
    required: false
    recommended: true
    range: integer
    exact_mappings:
    - BeStMeta:n_individuals_per_arena
    notes:
      - Can be derived from ExperimentalConditions/n_individuals_per_arena.
      - Report explicitly if fewer animals were successfully tracked.

  n_bodyparts_tracked:
    description: Number of body parts or keypoints tracked per individual.
    required: false
    recommended: true
    range: integer
    notes:
    - For centroid tracking, use 1.
    - For pose-estimation approaches, report the number of tracked landmarks.

  dropped_frames_count:
    description: Number of video frames lost or omitted during acquisition.
    required: false
    recommended: true
    range: integer
    examples:
      - value: "0"
      - value: "12"
    notes:
      - Report frames missing due to acquisition, recording, or encoding issues.
      - A value of 0 indicates no dropped frames were detected.

  frames_without_tracked_individual:
    description: Percentage of frames in which no individual was tracked.
    required: false
    recommended: true
    range: float
    minimum_value: 0
    maximum_value: 100

  frames_without_tracked_bodypart:
    description: Percentage of frames in which no body part was tracked.
    required: false
    recommended: true
    range: float
    minimum_value: 0
    maximum_value: 100

  behavioral_metrics:
    description: List of behavioral metrics or endpoints extracted from tracking data.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "total distance moved"
      - value: "average velocity"
      - value: "time in center zone"
      - value: "freezing duration"

  endpoint_definitions:
    description: >-
      Definitions and calculation criteria used for behavioral endpoints,
      including thresholds, zone boundaries, event definitions, and other
      parameters required to reproduce endpoint calculations.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "Freezing defined as speed < 1 mm/s for ≥ 1 s"
      - value: "Center zone defined as central 50% of arena area"

  dropped_frames_reason:
    description: >-
      Reason for dropped or omitted frames during acquisition,
      recording, encoding, or quality control.
    required: false
    range: string
    examples:
      - value: "Camera buffer overflow"
      - value: "Temporary USB bandwidth limitation"
      - value: "Corrupted frames removed during quality control"
      - value: "Frames dropped due to encoder performance limitations"
      - value: "Network transmission interruption"

  tracking_notes:
    description: Free-text notes on the tracking analysis not captured by structured fields.
    required: false
    range: string

# --- StatisticalAnalysis slots ---
  statistical_software_name:
    description: Name of the software used for statistical analysis.
    required: false
    recommended: true
    range: string
    exact_mappings:
      - AFR:0002802
    examples:
      - value: "R"
      - value: "GraphPad Prism"
      - value: "SPSS"
      - value: "SAS"
      - value: "Stata"
    notes:
    - Use a software/package name rather than a software class or workflow.

  statistical_software_version:
    description: Version string of the software used for statistical analysis.
    required: false
    recommended: true
    range: string
    exact_mappings:
      - AFR:0001700

  statistical_tests:
    description: >-
      Statistical tests applied to behavioral endpoints
      for hypothesis testing or inference.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "Student's t-test"
      - value: "Mann-Whitney U test"
      - value: "one-way ANOVA"
      - value: "two-way ANOVA"
      - value: "repeated-measures ANOVA"
      - value: "Kruskal-Wallis test"
      - value: "Wilcoxon signed-rank test"
      - value: "Chi-square test"
    exact_mappings:
      - NCIT:C53228
    notes:
      - Multiple tests may be listed if different endpoints were analysed with different methods.

  statistical_models: ## maybe remove this slot and put it together with "statistical_test"/"statistical_methods"
    description: Statistical models used to analyse behavioral endpoints.
    required: false
    recommended: true
    range: string
    multivalued: true
    exact_mappings:
      - STATO:0000107
    examples:
      - value: "linear mixed-effects model"
      - value: "generalized linear model"
      - value: "generalized additive model"
      - value: "Cox proportional hazards model"
      - value: "logistic regression"

  multiple_testing_correction:
    description: >-
      Procedure used to correct for multiple comparisons (if more than one
      hypothesis was tested).  Include the name of the method and any
      parameters (e.g., false‑discovery‑rate level).
    required: false
    recommended: true
    range: string
    exact_mappings:
     - OBI:0200089
    examples:
      - value: "Benjamini‑Hochberg FDR (q = 0.05)"
      - value: "Bonferroni (α / n = 0.001)"

  significance_level:
    description: Significance threshold used for hypothesis testing (e.g., alpha).
    required: false
    recommended: true
    range: float
    minimum_value: 0
    maximum_value: 1
    exact_mappings:
      - NCIT:C41265
    examples:
      - value: "0.05"
      - value: "0.01"

  effect_size_measure:
    description: >-
      Effect size measure reported to quantify the magnitude of observed
      effects or associations.
    required: false
    recommended: true
    range: string
    multivalued: true
    close_mappings:
      - NCIT:C209463
    examples:
      - value: "Cohen's d"
      - value: "Hedges' g"
      - value: "eta-squared"
      - value: "partial eta-squared"
      - value: "odds ratio"
      - value: "Pearson's r"
      - value: "Spearman's rho"

  confidence_interval_level:
    description: Confidence interval reported for statistical results.
    required: false
    recommended: true
    range: string
    multivalued: true
    exact_mappings:
      - STATO:0000196
    examples:
      - value: "95% CI"

  sample_size_analysis:
    description: Sample size or power analysis method, software, or justification used before the study.
    required: false
    recommended: true
    range: string
    multivalued: true
    examples:
      - value: "power analysis in G*Power"
      - value: "calculated using alpha=0.05 and power=0.8"
    exact_mappings:
      - NCIT:C115467

  statistics_notes:
    description: Free-text notes on the statistical analysis not captured by structured fields.
    required: false
    range: string


###########################################################################################################
# --- Enums ---
###########################################################################################################

enums:

  SubjectTypeEnum:
    description: >-
      Indicates whether the tracked subject is a whole organism or a
      cell/cell culture, since some biological identity fields (e.g. sex,
      developmental stage) only apply to whole organisms.
    permissible_values:
      organism:
        description: A whole living organism (e.g. zebrafish, mouse, insect).
      cell:
        description: >-
          A cell, cell culture, or cell line (e.g. in vitro cell tracking,
          organoid).

  SexEnum:
    description: Biological sex of the study subjects
    permissible_values:
      male:
      female:
      mixed:
        description: Mixed male and female in same group.
      unknown:
      not_applicable:
        description: e.g. asexual organisms, embryos

  DevelopmentalStageEnum:
    description: Controlled vocabulary of developmental stages of an organism.
    permissible_values:
      larval:
      juvenile:
      adult:
      embryonic:
      pupal:
      subadult:

  DevelopmentUnitEnum:
    description: Units of time used to express the developmental age of an organism.
    permissible_values:
      hpf:
        description: Hours post fertilization
      dpf:
        description: Days post fertilization
      days:
        meaning: UO:0000033
      weeks:
        meaning: UO:0000034
      months:
        meaning: UO:0000035
      years:
        meaning: UO:0000036

  LengthUnitEnum:
    description: Units of length, ranging from micrometers to meters.
    permissible_values:
      um:
        meaning: UO:0000017
      mm:
        meaning: UO:0000016
      cm:
        meaning: UO:0000015
      meter:
        meaning: UO:0000008
        aliases: ["m"]

  WeightUnitEnum:
    description: Units of mass used to express weight measurements, ranging from micrograms to kilograms.
    permissible_values:
      ug:
        meaning: UO:0000023
      mg:
        meaning: UO:0000022
      gram:
        meaning: UO:0000021
        aliases: ["g"]
      kg:
        meaning: UO:0000009

  ArenaShapeEnum:
    description: Geometric shape of the test arena. ## get feedback if the values are suitable
    permissible_values:
      circular:
      rectangular:
      square:
      plus_maze:
      y_maze:
      t_maze:
      other:

  ArenaTypeEnum:
    description: Type of the test arena, e.g., open field, multiwell plate or elevated plus maze.
    permissible_values:
      open_field:
      plus_maze:
      y_maze:
      t_maze:
      multiwell_plate:
      light_dark_box:
      elevated_plus_maze:
      other:

  WellCrossSectionShapeEnum:
    description: Geometric cross section shape of the wells of a multiwell plate.
    permissible_values:
      circular:
      square:
      other:

  WellBottomShapeEnum:
    description: Geometric bottom shape of the wells of a multiwell plate.
    permissible_values:
      flat_bottom:
        description: Flat well bottom; also called F-bottom.
      u_bottom:
        description: Rounded well bottom; also called round-bottom.
      v_bottom:
        description: V-shaped or conical well bottom.
      other:

  LightCycleTypeEnum:
    description: Standardized light-dark cycle types.
    permissible_values:
      cyclic_ld:
        description: Cyclic light-dark cycle, e.g. 14:10 LD.
      constant_light:
        description: Continuous light.
      constant_dark:
        description: Continuous darkness.
      other:
        description: Other or non-standard light regime.

  ConcentrationUnitEnum:
    description: Units of concentration used to express the amount of a substance per volume of solution.
    permissible_values:
      mg_per_l:
      ug_per_l:
      mmol_per_l:
      umol_per_l:

  ExposureRouteEnum:
    description: Route of chemical or treatment exposure.
    permissible_values:
      waterborne:
      dietary:
      injection_ip:
        description: "Intraperitoneal injection"
      injection_iv:
        description: "Intravenous injection"
      gavage:
      topical:
      inhalation:
      other:
      
  DeviceTypeEnum:
    description: Category of recording system used to record the videos.
    permissible_values:
      camera:
        description: A standalone camera system.
      microscope:
        description: A microscope-integrated imaging system.
      closed_box_system:
        description: >-
          A commercial, integrated/closed-box imaging system where individual
          camera or microscope specs are not user-accessible (e.g. a
          proprietary multi-well plate-based VTA device used in ecotox
          screening, such as DanioVision or ZebraBox).
      in_house_system:
        description: >-
          A custom-built or lab-assembled imaging system not corresponding
          to a single off-the-shelf camera or microscope product.

  ControlTypeEnum:
    description: Type of control condition used in the experiment for comparison against treated groups.
    permissible_values:
      solvent_control:
      vehicle_control:
      naive_control:
      sham_control:
      positive_control:
      untreated_control:
      other:

  CameraSensorTypeEnum:
    description: Image sensor technologies used in cameras.
    permissible_values:
      ccd:
        meaning: CHMO:0002245
      cmos:
      scmos:
      emccd:
      other:
      
  CameraTypeEnum:
    description: Type of camera used to record the videos.
    permissible_values:
      machine_vision_camera:
        description: Industrial/scientific machine vision camera (e.g. Basler, FLIR).
      webcam:
        description: Consumer-grade webcam.
      smartphone_camera:
        description: Camera integrated into a smartphone or tablet.
        meaning: SNOMED:733681009
      action_camera:
        description: Ruggedized action camera (e.g. GoPro-type device).
      dslr_mirrorless_camera:
        description: DSLR or mirrorless consumer/prosumer camera.
      thermal_camera:
        description: Infrared/thermal imaging camera.
      other:
        description: Camera type not covered by other enum values.
        
  CameraInterfaceEnum:
    description: Data interface used to connect the camera to a recording system.
    permissible_values:
      usb2:
        description: USB 2.0 interface.
      usb3:
        description: USB 3.0 / USB 3.1 / USB 3.2 interface.
      gige:
        description: Gigabit Ethernet (GigE Vision) interface.
      camera_link:
        description: Camera Link interface, commonly used in machine vision.
      coaxpress:
        description: CoaXPress high-speed coaxial interface.
      firewire:
        description: IEEE 1394 (FireWire) interface.
      hdmi:
        description: HDMI video output interface.
      wireless:
        description: Wireless connection (e.g. Wi-Fi, Bluetooth).
      internal_integrated:
        description: >-
          Camera is internally integrated into the recording device with
          no external interface (e.g. smartphone camera, closed-box system).
      other:
        description: Interface type not covered by other enum values.

  CameraPositionEnum:
    description: Position of the camera relative to the arena used to record the tracked organism(s).
    permissible_values:
      overhead:
        description: Camera positioned vertically above the arena.
      lateral:
        description: Camera positioned horizontally from the side.
      other:

  MicroscopeTypeEnum:
    description: OME microscope type values.
    exact_mappings:
      - OME:Type
    permissible_values:
      upright:
      inverted:
      dissection:
      electrophysiology:
      other:

  ClosedBoxSystemEnum:
    description: >-
      Commercial closed-box system used for recording and tracking the organism(s)
      in a controlled environment.
    permissible_values:
      zebrabox:
      daniovision:
      toxmate:
      noldus_phenotyper:
      other:
      
  WellPlateFormatEnum:
    description: Type of well plate used in a closed box system.
    permissible_values:
      well_6:
        description: 6-well plate.
      well_12:
        description: 12-well plate.
      well_24:
        description: 24-well plate.
      well_48:
        description: 48-well plate.
      well_96:
        description: 96-well plate.
      well_384:
        description: 384-well plate.
      other:
        description: Plate format not covered by other enum values.

  IlluminationTypeEnum:
    description: Technology type of the light source used during video recording.
    permissible_values:
      white_light:
        description: Standard broadband visible light.
      infrared:
        description: Infrared illumination panel or backlight; use illumination_wavelength_nm for exact wavelength.
      fluorescent:
        description: Fluorescent light source.
      led:
        description: LED-based illumination without further specification.
      ambient:
        description: Environmental or room lighting without a dedicated source.
      none:
        description: No active illumination.
      other:
        description: Other illumination type; describe in acquisition_notes.

  ColorModeEnum:
    description: Color mode of the video recording.
    permissible_values:
      grayscale:
        description: Single-channel intensity image.
      rgb:
        description: Three-channel red-green-blue color image.
      other:
        description: Other color mode; describe in acquisition_notes.

  VideoContainerEnum:
    description: Video file container format.
    permissible_values:
      mp4:
        description: MPEG-4 container.
      avi:
        description: Audio Video Interleave.
      mov:
        description: Apple QuickTime container.
      other:
        description: Other container format; describe in acquisition_notes.

  VideoCodecEnum:
    description: Video compression codec used for recording.
    permissible_values:
      h264:
      h265:
      ffv1:
      av1:
      mjpeg:
      mpeg4:
        description: MPEG-4 Part 2 codec (DivX/Xvid); not to be confused with the mp4 container format.
      raw:
        description: Uncompressed video; no codec applied.
      other:
        description: Other codec; describe in acquisition_notes.

  ContrastPolarityEnum:
    description: Polarity of object-to-background contrast in the video.
    permissible_values:
      bright_on_dark:
        description: >-
          Tracked object appears brighter than the background
          (analogous to dark-field imaging).
      dark_on_bright:
        description: >-
          Tracked object appears darker than the background
          (analogous to bright-field imaging).
      mixed:
        description: Polarity varies across regions, frames, or channels.
      unknown:
        description: Polarity not determined or not reported.

  PreprocessingStepEnum:
    description: Type of preprocessing step applied to the video data prior to tracking or analysis.
    permissible_values:
      background_subtraction:
        description: Removal of static background elements.
      brightness_normalization:
        description: Adjustment of brightness levels.
      contrast_enhancement:
        description: Improvement of contrast.
      spatial_filtering:
        description: Spatial domain filtering, for example Gaussian blur.
      temporal_filtering:
        description: Temporal smoothing across frames.
      roi_masking:
        description: Restriction to a region of interest.
      noise_reduction:
        description: Denoising applied to the video.
      frame_averaging:
        description: Averaging multiple frames.
      perspective_correction:
        description: Geometric correction of image perspective.
      colour_space_conversion:
        description: Conversion between color spaces.
      thresholding:
        description: Segmentation of objects using intensity or color thresholds.
      image_stabilization:
        description: Correction of camera movement between frames.
      other:
        description: Other preprocessing step, describe in notes.

  TrackingSoftwareTypeEnum:
    description: Type of tracking software used.
    permissible_values:
      standard:
        description: Commercial or publicly available software package.
      custom:
        description: Home-developed, in-house, or project-specific software.
      modified_standard:
        description: Standard software with custom modifications, plugins, or scripts.
      unknown:
        description: Software type not reported.

types:
  duration:
    uri: xsd:duration
    base: str
    description: A time duration in ISO 8601 format
    pattern: "^P(?!$)(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?(T(?=\\d)(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?$"
