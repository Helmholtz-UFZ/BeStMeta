# =============================================================================
# BeStMeta Metadata Schema — Video Tracking Assay Metadata Standard
# Version: 0.1.0 (DRAFT)
# Based on: DOI:XX.XXXX/vta-paper (BeStMeta paper, 2026)
# License: CC-BY 4.0
# Author: Steffi Bredemeyer
# =============================================================================

##to do: check all comments

id: https://w3id.org/bestmeta/schema
name: bestmeta 
title: BeStMeta Metadata Schema
description: >-
  A cross-domain metadata schema for video tracking assays (VTAs) with focus on
  ecotoxicology and biomedical research. Designed to improve FAIR compliance
  by providing structured, machine-readable metadata for VTA datasets and
  individual trials.
version: 0.1.0
license: https://creativecommons.org/licenses/by/4.0/

# --- prefixes ---
prefixes:
  linkml:     https://w3id.org/linkml/
  BeStMeta:   https://w3id.org/BeStMeta/
  OBI:        http://purl.obolibrary.org/obo/OBI_
  EFO:        http://www.ebi.ac.uk/efo/EFO_ 
  CHEBI:      http://purl.obolibrary.org/obo/CHEBI_
  NCBITaxon:  http://purl.obolibrary.org/obo/NCBITaxon_
  SWO:        http://purl.obolibrary.org/obo/SWO_
  ma:         http://www.w3.org/ns/ma-ont#
  ebucore:    http://www.ebu.ch/metadata/ontologies/ebucore/ebucore#
  dcterms:    http://purl.org/dc/terms/
  pav:        http://purl.org/pav/ 
  schema:     http://schema.org/
  dwc:        http://rs.tdwg.org/dwc/terms/
  geno:       http://purl.obolibrary.org/obo/GENO_
  UO:         http://purl.obolibrary.org/obo/UO_
  MESH:       http://id.nlm.nih.gov/mesh/

default_prefix: bstm
default_range: string

# --- imports ---
imports:
  - linkml:types

# --- types ---
types:
  UnitString: ## useful for free-text field, e.g., substance_dose_unit, where many different units are possible - check if needed
    typeof: string
    uri: UO:0000000
    id_prefixes:
      - UO
    exact_mappings:
      - qud:Unit
    description: >-
      A standard of measurement drawn from the Units of Measurement
      Ontology (UO:0000000).
# --- classes ---
classes:

  VTADataset:
    description: >-
      Top-level study and provenance metadata for a VTA dataset.
      One record per publication or deposited dataset. Contains
      identifying, licensing, and bibliographic information.
    slots:
      - dataset_id
      - dataset_title
      - dataset_description
      - dataset_version
      - dataset_license
      - dataset_doi
      - publication_doi
      - dataset_created_date
      - dataset_creator_name
      - dataset_creator_orcid
      - dataset_contact_email
      - research_domain
      - raw_data_repository
      - raw_data_repository_url
      - raw_tracking_data_format
      - raw_tracking_data_doi
      - analysis_code_repository
      - analysis_code_repository_url
      - analysis_code_doi
      # --- Nested classes ---
      - experimental_conditions
      - video_hardware
      - acquisition_parameters
      - tracking_analysis
      -  vta_trials
    tree_root: true

  ExperimentalConditions:
    description: >-
      Biological and experimental conditions applicable to all trials in
      the dataset. Covers organism identity, treatment, assay design,
      and environmental parameters.
    slots:
      # Organism identity (Tier 1 mandatory)
      - species_name
      - species_ncbi_taxon_id
      - strain
      - genotype
      - sex
      - developmental_stage
      - developmental_stage_value
      - developmental_stage_unit
      - age_value
      - age_unit
      - body_length_value
      - body_length_unit
      - weight_value
      - weight_unit
      - n_animals_total
      - n_animals_per_arena
      # Assay design
      - assay_type
      - assay_description
      - arena_shape
      - arena_type
      - arena_length
      - arena_length_unit
      - arena_width
      - arena_width_unit
      - arena_height
      - arena_height_unit
      - plate_well_count
      - well_shape_cross_section
      - well_shape_bottom
      - habituation_duration_min
      - habituation_protocol
      - temperature_celsius
      - light_cycle
      - light_cycle_detail
      - housing_conditions ##define!
      # Exposure / treatment (ecotox & biomedical)
      - treatment_name
      - treatment_description
      - exposure_compound_name
      - exposure_compound_chebi_id  
      - exposure_concentration
      - exposure_concentration_unit
      - exposure_route
      - exposure_duration_h
      - solvent_vehicle
      - control_type
      - treatment_name
      - treatment_description ## maybe better to ecotox extension
      - solvent_vehicle
      - control_type

      - recording_duration_value ##maybe better to AquisitionParameters
      - recording_duration_unit
      
# --- rules ---
    rules:
      - description: >-
          At least one of: developmental_stage (categorical),
          developmental_stage_value+unit, or age_value+unit must be provided
        any_of:
          - slot_conditions:
              developmental_stage:
                required: true
          - slot_conditions:
              developmental_stage_value:
                required: true
              developmental_stage_unit:
                required: true
          - slot_conditions:
              age_value:
                required: true
              age_unit:
                required: true

      - description: body_length_value requires body_length_unit
        preconditions:
          slot_conditions:
            body_length_value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            body_length_unit:
              required: true 
      
      - description: weight_value requires weight_unit
        preconditions:
          slot_conditions:
            weight_value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            weight_unit:
              required: true 

      - description: arena_length requires arena_length_unit
        preconditions:
          slot_conditions:
            arena_length:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            arena_length_unit:
              required: true

      - description: arena_width requires arena_width_unit
        preconditions:
          slot_conditions:
            arena_width:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            arena_width_unit:
              required: true

      - description: arena_height requires arena_height_unit
        preconditions:
          slot_conditions:
            arena_height:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            arena_height_unit:
              required: true

      - description: If light_cycle_type is cyclic_ld, light_cycle_detail should be provided.
        preconditions:
          slot_conditions:
            light_cycle_type:
              equals_string: cyclic_ld
        postconditions:
          slot_conditions:
            light_cycle_detail:
              required: true
          


# --- slots ---
slots:
# --- VTADataset slots ---
  dataset_id:
    description: Unique identifier for the dataset or study package.
    identifier: true
    required: true
    exact_mappings:
      - dcterms:identifier
 
  dataset_title:
    description: Descriptive title of the dataset.
    required: true
    exact_mappings:
      - dcterms:title

  dataset_description:
    description: Free-text description of the dataset and its scientific purpose
    required: false
    recommended: true
    exact_mappings:
      - dcterms:description

  dataset_version:
    description: Semantic version string for the dataset (e.g. 1.0.0)
    required: false
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    exact_mappings:
      primary:
      - pav:version
      secondary:
      - schema:version
      
  dataset_license:
    description: SPDX license identifier or URL (e.g. CC-BY-4.0)
    required: true
    exact_mappings:
      - dcterms:license
  
  dataset_doi:
    description: DOI of the deposited dataset (assigned by repository)
    range: uri
    required: false
    recommended: true
    multivalued: false
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"
    exact_mappings:
      - schema:identifier
    close_mappings:
    - dcterms:identifier

  publication_doi:
    description: DOI of the publication associated with the dataset.
    range: uri
    required: false
    recommended: true
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"
    exact_mappings:
      - schema:citation
      - dcterms:references

  dataset_created_date:
    description: Date when the dataset was created (YYYY-MM-DD)
    range: date
    required: false
    exact_mappings: 
      - dcterms:created
      - schema:creator

  dataset_creator_name:
    description: Name(s) of data creators.
    required: false
    recommended: true
    multivalued: true
    exact_mappings:
      - dcterms:creator
      - schema:creator
  
  dataset_creator_orcid:
    required: false
    recommended: true
    multivalued: true
    range: uri
    pattern: '^https://orcid\.org/\d{4}-\d{4}-\d{4}-\d{3}[0-9X]$'
    exact_mappings:
    - schema:identifier
    - dcterms:identifier

  dataset_contact_email:
    range: string
    required: false
    recommended: true
    description: Contact email for the dataset maintainer.
    pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
    exact_mappings:
      - schema:email

  research_domain:
    description: Primary research domain of this study.
    range: DomainEnum
    required: false
    recommended: true
    exact_mappings:
      - dcterms:subject

  raw_data_repository:
    description: Repository where raw tracking data and/or video files are deposited.
    required: false
    recommended: true
    range: RepositoryEnum
  
  raw_data_repository_url:
    description: URL of the repository record or landing page.
    required: false
    recommended: true
    range: uri
    exact_mappings:
      - schema:url
      - dcterms:source

  raw_tracking_data_format:
    description: File format of the raw tracking data.
    required: false
    recommended: true
    range: RawDataFormatEnum
    multivalued: true

  raw_tracking_data_doi:
    description: DOI of the deposited raw tracking data
    required: false
    range: uri
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"
    exact_mappings:
    - schema:identifier
    close_mappings:
    - dcterms:identifier

  analysis_code_repository:
    description: Repository where analysis code is hosted.
    required: false
    range: RepositoryEnum

  analysis_code_repository_url:
    description: URL of the code repository.
    required: false
    range: uri
    exact_mappings:
      - schema:codeRepository
      - schema:url

  analysis_code_doi:
    description: DOI of the deposited analysis code.
    required: false
    range: uri
    pattern: "^https://doi\\.org/10\\.\\d{4,9}/[-._;()+/:A-Za-z0-9%]+$"

  # Nested class slots
  experimental_conditions:
    description: Biological and experimental conditions for this dataset
    range: ExperimentalConditions
    inlined: true

  video_hardware:
    description: Camera and hardware configuration
    range: VideoHardware
    inlined: true

  acquisition_parameters:
    description: Video acquisition and recording settings
    range: AcquisitionParameters
    inlined: true

  tracking_analysis:
    description: Tracking software and analysis configuration
    range: TrackingAnalysis
    inlined: true

  vta_trials:
    description: Per-video trial records in this dataset
    range: VTATrial
    multivalued: true
    inlined: true

# --- ExperimentalConditions slots ---
  species_name:
    description: Scientific (Latin) binomial name of the study organism
    required: true
    exact_mappings:
      - dwc:scientificName
    examples:
      - value: "Danio rerio"
      - value: "Mus musculus"
      - value: "Daphnia magna"

  species_ncbi_taxon_id:
    description: NCBI Taxonomy ID for the study organism
    required: false
    recommended: true
    pattern: "^\\d+$"
    examples:
      - value: "7955" #Danio rerio
      - value: "10090" #Mus musculus

  strain:
    description: Organism strain or line
    required: false
    recommended: true
    range: string
    broad_mappings:
      - OBI:0001185  # organism strain

  genotype:
    description: Genotype identifier of the tracked organism(s).
    range: string
    required: false
    recommended: true
    annotations:
      source_ontology: GENO
  
  sex:
    description: Biological sex of the tracked organism(s).
    required: true ## or only recommended?
    range: SexEnum
    exact_mappings:
      - PATO:0000047

  developmental_stage:
    description: Developmental stage of the tracked organism(s).
    range: DevelopmentalStageEnum
    exact_mappings:
      - EFO:0000399
  
  developmental_stage_value:
    description: Numeric developmental stage value (e.g. 72 for 72 hpf) of the tracked organism(s).
    range: float
    close_mappings:
      - EFO:0000399

  developmental_stage_unit:
    description: Unit for developmental stage value of the tracked organism(s).
    range: DevelopmentUnitEnum

  age_value:
    description: Numeric age value of the tracked organism(s).
    range: float
    exact_mappings:
      - EFO:0000246 

  age_unit:
    description: Age unit of the tracked organism(s).
    range: DevelopmentUnitEnum

  body_length_value:
    description: Body length numeric value of the tracked organism(s).
    required: false
    recommended: true
    range: float
    close_mappings:
      - EFO:0004339
      - MESH:D049628

  body_length_unit:
    description: Body length unit of the tracked organism(s).
    required: false
    recommended: true
    range: LengthUnitEnum

  weight_value:
    description: Body weight numeric value of the tracked organism(s).
    required: false
    range: float
    exact_mappings: 
      - EFO:0004338

  weight_unit:
    description: Body weight unit of the tracked organism(s).
    required: false
    range: WeightUnitEnum

  n_animals_total:
    description: Total number of animals used in the experiment.
    range: integer
    required: true
  
  n_animals_per_arena:
    description: Number of animals tested simultaneously in the arena.
    required: true
    range: integer
    minimum_value: 1
  
  assay_type:
    description: Name of the behavioral assay paradigm or test paradigm.
    required: true
    examples:
      - value: "open field test"
      - value: "light-dark transition"
      - value: "elevated plus maze"
      - value: "locomotor activity assay"
      - value: "chemobehavioural assay"    
    broad_mappings:
      - OBI:0000070
    
  assay_description:
    description: Free-text description of the assay protocol

  arena_shape:
    description: Geometric shape of the test arena.
    required: false
    recommended: true
    range: ArenaShapeEnum
    broad_mappings:
      - OBI:0000968
  
  arena_type: 
    description: Type of the test arena, e.g., open field, multiwell plate or elevated plus maze.
    required: false
    recommended: true
    range: ArenaTypeEnum
  
  arena_length:
    description: Length of the arena along one axis.
    required: false
    recommended: true
    range: float
  
  arena_length_unit:
    required: false
    recommended: true
    range: LengthUnitEnum

  arena_width:
    description: Width of the arena along one axis.
    required: false
    recommended: true
    range: float
  
  arena_width_unit:
    required: false
    recommended: true
    range: LengthUnitEnum

  arena_height:
    description: Height of the arena, when applicable.
    required: false
    recommended: true
    range: float
  
  arena_height_unit:
    required: false
    recommended: true
    range: LengthUnitEnum
  
  plate_well_count:
    description: Number of wells in the multiwell plate.
    required: false
    recommended: true
    range: integer
    minimum_value: 1
    examples:
      - value: 24
      - value: 96

  well_shape_cross_section:
    description: Geometric cross section shape of the wells of a multiwell plate.
    required: false
    recommended: true
    range: WellCrossSectionShapeEnum

  well_shape_bottom:
    description: Geometric bottom shape of the wells of a multiwell plate.
    required: false
    range: WellBottomShapeEnum

  habituation_duration_min:
    description: Duration of habituation period before recording, in minutes
    required: false
    range: float
    unit:
      ucum_code: min

  habituation_protocol:
    description: Description of habituation or acclimation prior to testing.
    required: false
    range: string  
  
  temperature_celsius:
    description: Water or ambient temperature during the recording in degrees Celsius
    range: float
    required: true
    unit:
      ucum_code:  Cel
  
  light_cycle_type:
    description: Standardized category of the light-dark cycle.
    required: false
    recommended: true
    range: LightCycleTypeEnum

  light_cycle_detail:
    description: Free-text description of the light-dark cycle.
    required: false
    recommended: true
    range: string

  housing_conditions:
    description: Free-text description of animal housing conditions prior to assay.
    required: false
    range: string

  treatment_name:
    description: Short label identifying the experimental treatment group, condition, or regimen.
    required: false
    recommended: true
    range: string
    examples:
      - value: "diazepam 1 mg/kg"
      - value: "atrazine 10 ug/L"
      - value: "vehicle control"

  treatment_description:
    description: Full description of the treatment protocol.
    required: false
    recommended: true
    range: string

  exposure_compound_name:
    description: Name of the chemical, drug, or substance used in the treatment or exposure.
    required: false
    recommended: true
    range: string

  exposure_compound_chebi_id:
    description: ChEBI identifier for the test substance.
    required: false
    recommended: true
    range: string
    pattern: "^CHEBI:\\d+$"
    examples:
      - value: "CHEBI:15930"   # atrazine
      - value: "CHEBI:49575"  # diazepam
    
  exposure_concentration:
    description: Nominal exposure concentration (numeric value only; use unit field).
    required: false
    recommended: true
    range: float

  exposure_concentration_unit:
    description: Unit for exposure concentration.
    required: false
    recommended: true
    range: ConcentrationUnitEnum

  exposure_route:
    description: Route of chemical or treatment administration.
    required: false
    range: ExposureRouteEnum

  exposure_duration_h:
    description: Duration of chemical or treatment exposure in hours.
    required: false
    range: float
    unit:
      ucum_code: h

  solvent_vehicle:
    description: Solvent or vehicle used to dissolve the test substance.
    required: false
    range: string
    examples:
      - value: "DMSO 0.01%"
      - value: "ethanol 0.1%"
      - value: "water" 

  control_type:
    description: Type of control group used.
    required: false
    range: ControlTypeEnum


      - recording_duration_value ##maybe better to AquisitionParameters
      - recording_duration_unit



# --- Enums ---
enums:

  DomainEnum: ##ask others for which domains to include
    description: Research domain of the study
    permissible_values:
      ecotoxicology:
      biomedical:
      neuroscience:
      other:

  RepositoryEnum:
    permissible_values: ##add more
      Zenodo:
      OSF:
      Figshare:
      Dryad:
      journal_supplementary:
        description: Supplementary material hosted by the journal

  RawDataFormatEnum:
    permissible_values:
      CSV:
      XLSX:
      HDF5:
      JSON:
      ZIP:
      PHR:
        description: Zebrabox raw file

  SexEnum:
    description: Biological sex of the study subjects
    permissible_values:
      male:
      female:
      mixed:    { description: "Mixed male and female in same group" }
      unknown:
      not_applicable: { description: "e.g. asexual organisms, embryos" } 

  DevelopmentalStageEnum:
    permissible_values:
      larval:
      juvenile:
      adult:
      embryonic:       
      pupal:
      subadult:

  DevelopmentUnitEnum:
    permissible_values:
      hpf:
        description: Hours post fertilization
      dpf:
        description: Days post fertilization
      days:
        meaning: UO:0000033
      weeks:
        meaning: UO:0000034
      months:
        meaning: UO:0000035
      years:
        meaning: UO:0000036
    
  LengthUnitEnum: ## it would be more consistent and better for machine-readability to have just one unit - but hard for cross-domain approach
    permissible_values:
      um:
        meaning: UO:0000017
      mm:
        meaning: UO:0000016
      cm:
        meaning: UO:0000015
      m:
        meaning: UO:0000008

  WeightUnitEnum:
    permissible_values:
      ug:
        meaning: UO:0000023
      mg:
        meaning: UO:0000022
      g:
        meaning: UO:0000021
      kg:
        meaning: UO:0000009
  
  ArenaShapeEnum:
    description: Geometric shape of the test arena. ## get feedback if the values are suitable
    permissible_values:
      circular:  
      rectangular:
      square: 
      plus_maze:
      y_maze:
      t_maze: 
      other:
  
  ArenaTypeEnum:
    description: Type of the test arena, e.g., open field, multiwell plate or elevated plus maze.
    permissible_values:
      open_field:
      plus_maze:
      y_maze:
      t_maze: 
      multiwell_plate:
      light_dark_box:
      elevated_plus_maze:
      other:

  WellCrossSectionShapeEnum:
    description: Geometric cross section shape of the wells of a multiwell plate.
    permissible_values:
      circular:
      square:
      other:

  WellBottomShapeEnum: 
    description: Geometric bottom shape of the wells of a multiwell plate.
    permissible_values:
      flat_bottom:
        description: Flat well bottom; also called F-bottom.
      u_bottom:
        description: Rounded well bottom; also called round-bottom.
      v_bottom:
        description: V-shaped or conical well bottom.
      other:
  
  LightCycleTypeEnum:
    description: Standardized light-dark cycle types.
    permissible_values:
      cyclic_ld:
        description: Cyclic light-dark cycle, e.g. 14:10 LD.
      constant_light:
        description: Continuous light.
      constant_dark:
        description: Continuous darkness.
      other:
        description: Other or non-standard light regime.

  ConcentrationUnitEnum:
    permissible_values:
      mg_per_l:
      ug_per_l:
      mmol_per_l:
      umol_per_l:

  ExposureRouteEnum:
    description: Route of chemical or treatment exposure
    permissible_values:
      waterborne:
      dietary:
      injection_ip:
        description: "Intraperitoneal injection"
      injection_iv:
        description: "Intravenous injection"
      gavage:
      topical:
      inhalation:
      other:

  ControlTypeEnum:
    solvent_control:
    vehicle_control:
    naive_control:
    sham_control:
    positive_control:
    untreated_control:
    other:
    
    

  
  
